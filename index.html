<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002A2C">
<meta name="description" content="SQL Server practice for data analysts by Occulenz: a new quiz every week, in Arabic and English.">
<title>SQL for Data Analysts · Occulenz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
/* The course home: which weeks are open. RELEASED (in the script) is the only thing to change each week. */
:root { --bg: #F4FAFA; --card: #FFFFFF; --surface: #E5F4F5; --text: #002A2C; --muted: #4A6C6E; --primary: #2E7D80; --amber: #CDA474; --line: #CFE6E7; --band: #002A2C; }
@media (prefers-color-scheme: dark) { :root { --bg: #000C0D; --card: #021A1B; --surface: #062A2C; --text: #E5F4F5; --muted: #8FB5B7; --primary: #74C9CD; --line: #0F3A3C; } }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.85 "Rubik", "Segoe UI", Tahoma, sans-serif; }
.band { background: var(--band); padding: 14px 16px; }
.band img { height: 26px; display: block; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
.eyebrow { color: var(--primary); font-weight: 600; font-size: 14px; }
h1 { font: 700 34px/1.3 "Rubik", sans-serif; margin: 4px 0 8px; }
h1 .key { font-family: "Poppins", sans-serif; color: var(--primary); }
.lede { color: var(--muted); margin-bottom: 24px; }
.weeks { display: grid; gap: 8px; list-style: none; padding: 0; }
.wk { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: inherit; }
a.wk:hover, a.wk:focus-visible { border-color: var(--primary); outline: none; box-shadow: inset 0 0 0 1px var(--primary); }
.no { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--primary); font: 600 16px/1 "Poppins", sans-serif; }
.t { flex: 1; min-width: 0; }
.t b { display: block; font-weight: 600; line-height: 1.4; }
.t small { color: var(--muted); font-size: 13px; }
.tag { flex: none; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
.open .tag { background: var(--primary); color: var(--bg); }
.soon { opacity: .6; }
.soon .tag { background: var(--surface); color: var(--muted); }
.sql { font-family: "Poppins", sans-serif; direction: ltr; unicode-bidi: isolate; }
footer { color: var(--muted); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<div class="band"><img src="week-01/assets/occulenz-horizontal-light.svg" alt="Occulenz"></div>
<main>
  <p class="eyebrow">Occulenz · تدريب SQL Server</p>
  <h1>مسار <span class="key">SQL</span> للـ Data Analyst</h1>
  <p class="lede">كل اسبوع بينزل كويز جديد. افتح كويز الاسبوع، حل التحديات، وابعت الملخص اللي في صفحة النتيجة.</p>
  <ul class="weeks" id="weeks"></ul>
  <footer>Abdullah Nabil · Occulenz</footer>
</main>
<script>
// Each week: raise RELEASED by 1 and upload that week's folder.
const RELEASED = 1;
const WEEKS = [
  ['اختبار تحديد المستوى', 'شوية من كل حاجة: بيوريك تبدا منين', '15 تحدي · 60 دقيقة'],
  ['القراية من جدول', 'SELECT و ORDER BY و TOP', '11 تحدي · 45 دقيقة'],
  ['الفلترة والـ NULL', 'WHERE و LIKE و IS NULL', '12 تحدي · 45 دقيقة'],
  ['functions على الصف الواحد', 'النصوص والتواريخ و CASE', '15 تحدي · 60 دقيقة'],
  ['التجميع', 'GROUP BY و HAVING', '15 تحدي · 60 دقيقة'],
  ['الـ Joins', 'INNER و LEFT و FULL و self join', '15 تحدي · 60 دقيقة'],
  ['الـ subqueries والـ CTEs', 'EXISTS و WITH و UNION', '12 تحدي · 60 دقيقة'],
  ['الـ window functions', 'ROW_NUMBER و LAG والـ running totals', '15 تحدي · 60 دقيقة'],
  ['تحليلات الـ business', 'النمو والـ retention والـ funnels', '12 تحدي · 90 دقيقة'],
  ['المشروع الختامي', 'مراجعة المحل للادارة', '8 تحديات · 90 دقيقة'],
  ['اختبار تحديد المستوى تاني', 'شوف اتحسنت قد ايه من اول يوم', '15 تحدي · 60 دقيقة']
];
const pad = (n) => String(n).padStart(2, '0');
// Week 11 is the placement test again, so it opens the week-01 page.
document.getElementById('weeks').innerHTML = WEEKS.map(([title, sub, meta], k) => {
  const n = k + 1, open = n <= RELEASED, href = n === 11 ? 'week-01/' : `week-${pad(n)}/`;
  const inner = `<span class="no">${n}</span><span class="t"><b>اسبوع ${n} · ${title}</b><small>${sub} · ${meta}</small></span><span class="tag">${open ? 'ابدا' : 'قريب'}</span>`;
  return open ? `<li><a class="wk open" href="${href}">${inner}</a></li>` : `<li><div class="wk soon" aria-disabled="true">${inner}</div></li>`;
}).join('');
</script>
</body>
</html>
