<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002A2C">
<meta name="description" content="The SQL League by Occulenz: a weekly SQL Server competition in 9 rounds, in English and Arabic.">
<title>The SQL League · Occulenz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The league home: which rounds are open. RELEASED (in the script) is the only thing to change each week. */
:root { --bg: #F4FAFA; --card: #FFFFFF; --surface: #E5F4F5; --text: #002A2C; --muted: #4A6C6E; --primary: #2E7D80; --amber: #CDA474; --line: #CFE6E7; --band: #002A2C; }
@media (prefers-color-scheme: dark) { :root { --bg: #000C0D; --card: #021A1B; --surface: #062A2C; --text: #E5F4F5; --muted: #8FB5B7; --primary: #74C9CD; --line: #0F3A3C; } }
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.75 "Poppins", "Segoe UI", sans-serif; }
html[lang="ar"] body { font-family: "Rubik", "Segoe UI", Tahoma, sans-serif; line-height: 1.85; }
.band { background: var(--band); padding: 12px 16px; }
.band-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
.band img { height: 26px; display: block; }
.band .sp { flex: 1; }
.lsw { display: flex; border: 1px solid #1E4E50; border-radius: 999px; padding: 2px; }
.lsw button { font: 600 13px/1 "Poppins", sans-serif; color: #B8D8DA; background: none; border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.lsw button[aria-pressed="true"] { background: #E5F4F5; color: #002A2C; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
.eyebrow { color: var(--primary); font-weight: 600; font-size: 14px; }
h1 { font: 700 34px/1.3 "Poppins", sans-serif; margin: 4px 0 8px; }
html[lang="ar"] h1 { font-family: "Rubik", sans-serif; }
h1 .key { font-family: "Poppins", sans-serif; color: var(--primary); }
.lede { color: var(--muted); margin-bottom: 24px; }
.rules { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 24px; }
.rules b { display: block; margin-bottom: 8px; }
.rules ul { padding-inline-start: 20px; color: var(--muted); font-size: 14.5px; }
.rules li + li { margin-top: 4px; }
.weeks { display: grid; gap: 8px; list-style: none; padding: 0; }
.wk { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: inherit; }
a.wk:hover, a.wk:focus-visible { border-color: var(--primary); outline: none; box-shadow: inset 0 0 0 1px var(--primary); }
.no { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--primary); font: 600 16px/1 "Poppins", sans-serif; }
.t { flex: 1; min-width: 0; }
.t b { display: block; font-weight: 600; line-height: 1.4; }
.t small { color: var(--muted); font-size: 13px; }
.tag { flex: none; font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; }
.open .tag { background: var(--primary); color: var(--bg); }
.soon { opacity: .6; }
.soon .tag { background: var(--surface); color: var(--muted); }
footer { color: var(--muted); font-size: 13px; margin-top: 32px; }
</style>
</head>
<body>
<div class="band"><div class="band-in">
  <img src="week-01/assets/occulenz-horizontal-light.svg" alt="Occulenz">
  <span class="sp"></span>
  <div class="lsw" role="group" aria-label="Language"><button type="button" data-l="en" lang="en">EN</button><button type="button" data-l="ar" lang="ar">عربي</button></div>
</div></div>
<main>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="rules"><b id="rulesT"></b><ul id="rules"></ul></div>
  <ul class="weeks" id="weeks"></ul>
  <footer>Abdullah Nabil · Occulenz</footer>
</main>
<script>
// Each week: raise RELEASED by 1 and upload that round's folder.
const RELEASED = 1;
// The language is shared with the round pages (same key), so a choice made here carries over.
const LANG_KEY = 'occ-sqltrack:lang';
const ROUNDS = [
  [{ en: 'Reading a table', ar: 'القراية من جدول' }, 11, 55],
  [{ en: 'Filtering & NULL', ar: 'الفلترة والـ NULL' }, 12, 60],
  [{ en: 'Functions on one row', ar: 'functions على الصف الواحد' }, 15, 80],
  [{ en: 'Aggregation', ar: 'التجميع' }, 15, 75],
  [{ en: 'Joins', ar: 'الـ Joins' }, 15, 85],
  [{ en: 'Subqueries & CTEs', ar: 'الـ subqueries والـ CTEs' }, 12, 85],
  [{ en: 'Window functions', ar: 'الـ window functions' }, 15, 90],
  [{ en: 'Business analytics', ar: 'تحليلات الـ business' }, 12, 115],
  [{ en: 'The final: the shop review', ar: 'النهائي: مراجعة المحل' }, 8, 100]
];
const T = {
  en: { eyebrow: 'Occulenz · SQL Server', title: 'The <span class="key">SQL</span> League',
    lede: 'A competition in 9 rounds: a new round opens every week. Sign in with your personal code, solve the challenges and submit; your result reaches your instructor by itself.',
    rulesT: 'How the league works',
    rules: ['Each round has a fixed time. The clock starts at your first Start and keeps running, even if you close the page or start again.',
      'Only your first submitted attempt in each round counts. You can practise again afterwards; it will not count.',
      'Explain is free. A Hint makes that challenge count for half its points, and the Solution makes it 0.',
      'The ranking adds up your first-attempt percent of every round.'],
    round: 'Round {n}', meta: '{q} challenges · {m} min', go: 'Start', soon: 'Soon' },
  ar: { eyebrow: 'Occulenz · SQL Server', title: 'دوري الـ <span class="key">SQL</span>',
    lede: 'مسابقة على 9 جولات: كل اسبوع بتفتح جولة جديدة. ادخل بالكود بتاعك، حل التحديات وسلم، ونتيجتك بتوصل للمدرب لوحدها.',
    rulesT: 'الدوري ماشي ازاي',
    rules: ['كل جولة ليها وقت ثابت. العداد بيبدا من اول مرة تدوس فيها ابدا، وبيفضل شغال حتى لو قفلت الصفحة او بدات من الاول.',
      'اول محاولة تسلمها في كل جولة هي بس اللي بتتحسب. وتقدر تتمرن تاني بعدها، بس مش هتتحسب.',
      '"اشرحلي" ببلاش. التلميح بيخلي التحدي بنص درجته، والحل بيخليه بصفر.',
      'الترتيب بيجمع نسبة اول محاولة ليك في كل الجولات.'],
    round: 'الجولة {n}', meta: '{q} تحدي · {m} دقيقة', go: 'ابدا', soon: 'قريب' }
};
const pad = (n) => String(n).padStart(2, '0');
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v[k]);
function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = (lang === 'ar' ? 'دوري الـ SQL' : 'The SQL League') + ' · Occulenz';
  document.getElementById('eyebrow').textContent = t.eyebrow;
  document.getElementById('title').innerHTML = t.title;
  document.getElementById('lede').textContent = t.lede;
  document.getElementById('rulesT').textContent = t.rulesT;
  document.getElementById('rules').innerHTML = t.rules.map((r) => `<li>${r}</li>`).join('');
  document.getElementById('weeks').innerHTML = ROUNDS.map(([title, q, m], k) => {
    const n = k + 1, open = n <= RELEASED;
    const inner = `<span class="no">${n}</span><span class="t"><b>${fill(t.round, { n })} · ${title[lang]}</b><small>${fill(t.meta, { q, m })}</small></span><span class="tag">${open ? t.go : t.soon}</span>`;
    return open ? `<li><a class="wk open" href="week-${pad(n)}/">${inner}</a></li>` : `<li><div class="wk soon" aria-disabled="true">${inner}</div></li>`;
  }).join('');
  document.querySelectorAll('.lsw button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
}
let lang = 'en';
try { if (localStorage.getItem(LANG_KEY) === 'ar') lang = 'ar'; } catch (e) {}
document.querySelectorAll('.lsw button').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.l; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} render(lang);
}));
render(lang);
</script>
</body>
</html>
